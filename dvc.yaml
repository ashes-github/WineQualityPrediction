stages:
  ingestion:
    cmd: python main.py --stages ingestion
    deps:
    - config/config.yaml
    - main.py
    - src/winequality/components/data_ingestion.py
    - src/winequality/pipeline/data_ingestion_pipeline.py
    outs:
    - artifacts/data_ingestion/winequality-red.csv
  validation:
    cmd: python main.py --stages validation
    deps:
    - artifacts/data_ingestion/winequality-red.csv
    - config/config.yaml
    - main.py
    - schema.yaml
    - src/winequality/components/data_validation.py
    - src/winequality/pipeline/data_validation_pipeline.py
    outs:
    - artifacts/data_validation/status.txt
  transformation:
    cmd: python main.py --stages transformation
    deps:
    - artifacts/data_ingestion/winequality-red.csv
    - artifacts/data_validation/status.txt
    - config/config.yaml
    - main.py
    - src/winequality/components/data_transformation.py
    - src/winequality/pipeline/data_transformation_pipeline.py
    outs:
    - artifacts/data_transformation/test.csv
    - artifacts/data_transformation/train.csv
  training:
    cmd: python main.py --stages training
    deps:
    - artifacts/data_transformation/test.csv
    - artifacts/data_transformation/train.csv
    - config/config.yaml
    - main.py
    - schema.yaml
    - src/winequality/components/model_trainer.py
    - src/winequality/pipeline/model_trainer_pipeline.py
    params:
    - ElasticNet.alpha
    - ElasticNet.l1_ratio
    outs:
    - artifacts/model_trainer/model.joblib
  evaluation:
    cmd: python main.py --stages evaluation
    deps:
    - artifacts/data_transformation/test.csv
    - artifacts/model_trainer/model.joblib
    - config/config.yaml
    - main.py
    - schema.yaml
    - src/winequality/components/model_evaluation.py
    - src/winequality/pipeline/model_evaluation_pipeline.py
    params:
    - ElasticNet.alpha
    - ElasticNet.l1_ratio
    metrics:
    - artifacts/model_evaluation/metrics.json:
        cache: false

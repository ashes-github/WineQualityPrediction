name: Publish to GHCR and deploy to Render

on:
  push:
    branches:
      - render-space-deployment
    paths:
      - app.py
      - Dockerfile
      - requirements.txt
      - src/**
      - config/**
      - schema.yaml
      - params.yaml
      - templates/**
      - settings.py
      - .dockerignore
      - static/**
      - dvc.yaml
      - dvc.lock
      - .github/workflows/deploy-render.yml

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wine-quality-prediction-render
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wine-quality-prediction

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DVC and training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore model artifacts or train them
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DVC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_S3_SECRET_ACCESS_KEY }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          if dvc pull -r origin; then
            echo "Model artifacts restored from DVC remote."
          else
            echo "Model artifacts unavailable; restoring raw data and training."
            dvc repro
            dvc push -r origin
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Render deploy hook is missing."
            exit 1
          fi

          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
